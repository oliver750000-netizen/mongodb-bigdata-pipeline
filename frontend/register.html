<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Examen Big Data</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>Crear cuenta</h1>
      <p class="subtitle">Regístrate para acceder al dashboard</p>

      <form id="registerForm">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required>
        </div>

        <div class="form-group">
          <label for="password2">Repetir contraseña</label>
          <input type="password" id="password2" required>
        </div>

        <button type="submit" class="btn" id="btnRegister">Registrarme</button>
        <p class="error-msg" id="errorMsg"></p>
      </form>

      <p class="link">
        ¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
